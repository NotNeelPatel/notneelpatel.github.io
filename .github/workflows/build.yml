name: build and deploy

on:
  push:
    branches: [new-layout]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Static Site Generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo NotNeelPatel/static-site-generator --pattern 'ssg' --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/ssg"

      - name: Generate Site
        env:
          SSG_SITE_PATH: ${{ github.workspace }}/
        run: |
          "$RUNNER_TEMP/ssg-bin/ssg"
          ls -R "$SSG_SITE_PATH/out"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page-url }}
    steps:
      - name: Deploy to gh-pages
        id: deployment
        uses: actions/deploy-pages@v4
